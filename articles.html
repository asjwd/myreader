    function detectDeviceNameV58_(){
      const ua=String(navigator.userAgent||'');
      const platform=String(navigator.platform||'');
      const touch=Number(navigator.maxTouchPoints||0);

      if(/iPhone/i.test(ua))return 'iPhone';
      if(/iPad/i.test(ua) || (platform==='MacIntel' && touch>1))return 'iPad';
      if(/Android/i.test(ua))return 'Android';
      if(/Chrome|CriOS/i.test(ua))return 'Chrome Laptop';
      if(/Safari/i.test(ua))return 'Safari';
      return 'Personal device';
    }

    function currentDeviceFingerprintV62_(){
      const ua=String(navigator.userAgent||'');
      const platform=String(navigator.platform||'');
      const touch=Number(navigator.maxTouchPoints||0);
      const sw=Math.min(Number(screen.width||0),Number(screen.height||0));
      const sh=Math.max(Number(screen.width||0),Number(screen.height||0));
      const dpr=Math.round(Number(window.devicePixelRatio||1)*100)/100;

      let family='Browser';
      if(/CriOS/i.test(ua))family='Chrome-iOS';
      else if(/FxiOS/i.test(ua))family='Firefox-iOS';
      else if(/EdgiOS/i.test(ua))family='Edge-iOS';
      else if(/Chrome/i.test(ua))family='Chrome';
      else if(/Safari/i.test(ua))family='Safari';

      let deviceClass='Desktop';
      if(/iPhone/i.test(ua))deviceClass='iPhone';
      else if(/iPad/i.test(ua) || (platform==='MacIntel' && touch>1))deviceClass='iPad';
      else if(/Android/i.test(ua))deviceClass='Android';

      let tz='';
      try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(err){}

      return [
        deviceClass,
        family,
        platform,
        `${sw}x${sh}`,
        `dpr:${dpr}`,
        `touch:${touch}`,
        `lang:${String(navigator.language||'')}`,
        `tz:${tz}`,
        `depth:${Number(screen.colorDepth||0)}`
      ].join('|');
    }

    function confirmDeviceAuthorizationV58(){
      const btn=document.getElementById('deviceConfirmBtn');
      const otp=String(document.getElementById('deviceOtpInput')?.value||'').replace(/\D/g,'');

      if(!devicePairingRequestId){
        setDeviceGateStatusV58_('Request a new authorization code.',true);
        return;

      if(!/^\d{5}$/.test(otp)){
        setDeviceGateStatusV58_('Enter the 5-digit authorization code.',true);

      if(btn){btn.disabled=true;btn.textContent='Authorizing…'}

      google.script.run
        .withSuccessHandler(res=>{

          if(!res||!res.privateUrl){

          const codeStep=document.getElementById('deviceCodeStep');

      const bookScrollBefore=book?book.scrollTop:0;

        .withSuccessHandler(data=>{

          todayReadingSeconds=Math.max(

          // Manual refresh is authoritative/full, including reading time,

          initialActivityHydrationStartedV70=true;

          refillSelect(

          );

          if(hadOpenPaper){

              if(shelf)shelf.scrollTop=shelfScrollBefore;

      // V70: renderHome already calls renderShelf, so avoid doing the same
      // DOM render twice during first load.
      renderHome(openHomeOnNextInit);
      openHomeOnNextInit=false;

      // V108: direct/deep links from Projects or a new browser tab.
      try{
        const wanted=String(INITIAL_PAPER_ID||new URLSearchParams(window.location.search).get('paper')||'').trim();

    function paperIdNumber_(p){
      const id=String(p&&p.Paper_ID||'').trim();
      let m=id.match(/^A(\d{2})([a-z])$/i);
      if(m){
        const block=Number(m[1]);
        const letter=m[2].toLowerCase().charCodeAt(0)-96;
        if(block>=1&&block<=99&&letter>=1&&letter<=26)return (block-1)*26+letter;
      }
      m=id.match(/^P(\d+)$/i);
      return m?Number(m[1])||0:0;
    }

    function publicationYear_(p){
      const match=String(p&&p.Year||'').match(/\d{4}/);
      return match?Number(match[0]):0;
    }

    function getFilteredRecords(){
      const q=norm(document.getElementById('q').value.trim());
      const project=norm(document.getElementById('project').value);

      const direction=shelfSortDirection==='asc'?1:-1;

      return allRecords.filter(p=>{
        const hay=norm([p.Title,p.Authors,p.Keywords].join(' '));
        return (!q||q.split(/\s+/).every(t=>hay.includes(t))) &&
          (!project||splitTags(p.Collections).some(x=>norm(x)===project));
      }).sort((a,b)=>{
        let av=0,bv=0;

        if(shelfSortMode==='last_read'){
          av=dateValue(a.Last_Read_At);
          bv=dateValue(b.Last_Read_At);

          // Papers never read stay at the bottom in both directions.
          if(!av && bv)return 1;
          if(av && !bv)return -1;
        }else if(shelfSortMode==='modified'){
          av=dateValue(a.Date_Updated||a.Date_Added);
          bv=dateValue(b.Date_Updated||b.Date_Added);
        }else if(shelfSortMode==='year'){
          av=publicationYear_(a);
          bv=publicationYear_(b);
        }else{
          av=paperIdNumber_(a);
          bv=paperIdNumber_(b);
        }

        if(av!==bv)return (av-bv)*direction;

        // Stable fallback: latest/highest Article ID first within equal values.
        return paperIdNumber_(b)-paperIdNumber_(a);
      });
    }

      if(!filtered.length){

      const start=(currentPage-1)*pageSize;

    function renderPagination(totalItems,totalPages){
      const el=document.getElementById('pagination');
      if(totalPages<=1){el.innerHTML='';return;}

      const parts=[];
      parts.push(`<button class="pageBtn" ${currentPage===1?'disabled':''} onclick="changePage(${currentPage-1})" aria-label="Previous page">‹</button>`);

      pageTokens(currentPage,totalPages).forEach(token=>{
        if(token==='…'){
          parts.push('<span class="pageDots">…</span>');
        }else{
          parts.push(`<button class="pageBtn ${token===currentPage?'active':''}" onclick="changePage(${token})">${token}</button>`);
        }
      });

      parts.push(`<button class="pageBtn" ${currentPage===totalPages?'disabled':''} onclick="changePage(${currentPage+1})" aria-label="Next page">›</button>`);
      el.innerHTML=parts.join('');
    }

    function pageTokens(page,total){
      if(total<=7)return Array.from({length:total},(_,i)=>i+1);
      const out=[1];
      let start=Math.max(2,page-1),end=Math.min(total-1,page+1);
      if(page<=3){start=2;end=4}
      if(page>=total-2){start=total-3;end=total-1}
      if(start>2)out.push('…');
      for(let i=start;i<=end;i++)out.push(i);
      if(end<total-1)out.push('…');
      out.push(total);
      return out;
    }

    function changePage(page){
      const filtered=getFilteredRecords();
      const pageSize=activeShelfPageSize_()==='all'?Math.max(filtered.length,1):Number(activeShelfPageSize_()||DEFAULT_PAGE_SIZE);
      const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
      currentPage=Math.max(1,Math.min(Number(page)||1,totalPages));
      renderShelf();
    }

    function dateValue(v){
      const raw=String(v||'').trim();
      if(!raw)return 0;
      const normalized=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(raw)?raw.replace(' ','T'):raw;

    function firstAuthorEtAl(authors){

      const andParts=raw.split(/\s+and\s+/i).filter(Boolean);
      if(andParts.length>1)return `${andParts[0]} et al`;
      return raw;
    }

function bindArticleDropZone(zoneId,inputId,nameId,allowedExtensions){
      const zone=document.getElementById(zoneId);
      const input=document.getElementById(inputId);
      const name=document.getElementById(nameId);
      if(!zone||!input||!name)return;

      input.addEventListener('change',()=>{
        const file=input.files&&input.files[0];
        name.textContent=file?file.name:'No file selected';
      });

      zone.addEventListener('dragover',e=>{
        e.preventDefault();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
      zone.addEventListener('drop',e=>{
        e.preventDefault();
        zone.classList.remove('dragover');
        const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
        if(!file)return;
        const ext=String(file.name||'').split('.').pop().toLowerCase();
        if(!allowedExtensions.includes(ext)){
          toast('Only .zip, .xlsx, or .xls is accepted.','error');
          return;
        }
        const dt=new DataTransfer();
        dt.items.add(file);
        input.files=dt.files;
        name.textContent=file.name;
      });
    }

    function getProjectDirectoryData(){
      const projectMap=new Map();
      allRecords.forEach(p=>{

          const key=norm(name).trim();
          if(!key)return;

          cur.lastUpdated=Math.max(cur.lastUpdated,updatedAt);
          projectMap.set(key,cur);

    function articleTtsFemaleVoiceV191_(lang){
      const root=String(lang||'id-ID').toLowerCase().startsWith('id')?'id':'en';
      const voices=refreshArticleTtsVoicesV190_();
      const same=voices.filter(v=>String(v.lang||'').toLowerCase().startsWith(root));
      if(!same.length)return null;

      // Restore the original V189 behaviour: prioritize female voices that match
      // the detected language. Indonesian chunks therefore use an Indonesian
      // female voice instead of being forced through an English/multilingual voice.
      const femaleHints=root==='id'
        ? ['gadis','damayanti','google bahasa indonesia','indonesian female','female']
        : ['aria','jenny','zira','samantha','victoria','karen','moira','tessa','fiona','ava','allison','susan','emma','olivia','serena','hazel','salli','joanna','kendra','kimberly','ivy','raveena','google us english','google uk english female','female'];
      const maleHints=root==='id'
        ? ['ardi','male','pria']
        : ['david','mark','george','daniel','alex','fred','ralph','tom','aaron','guy','ryan','male'];

      const score=v=>{
        const name=String(v.name||'').toLowerCase();
        let n=0;
        if(femaleHints.some(x=>name.includes(x)))n+=100;
        if(maleHints.some(x=>name.includes(x)))n-=100;
        // Prefer newer/natural system voices when the platform exposes that in the name.
        if(/natural|neural|enhanced|premium|online/.test(name))n+=28;
        if(String(v.lang||'').toLowerCase()===(root==='id'?'id-id':'en-us'))n+=8;
        if(v.default)n+=2;
        return n;
      };

      const ranked=same.slice().sort((a,b)=>score(b)-score(a));
      const explicitFemale=ranked.find(v=>score(v)>=100);
      if(explicitFemale)return explicitFemale;

      // Some browsers do not expose gender metadata. Keep the language match and

    function detectArticleTtsLanguageV190_(text){

      ]);
      const enWords=new Set([
        'the','and','with','from','for','of','to','in','is','are','was','were','this','that','these','those','by','as','between','because','can','could','will','has','have','also','not','more','results','result','research','method','methods','data','shows','showed','using','based','objective','process','year','authors','author','sample','analysis','quality','water','waste','environmental','value','therefore','however','through','study','paper','model','performance','review','findings','conclusion','conclusions','abstract','insight','insights','background','reasoning','methodology','preliminary','discussion','additional','statistics','systematic','structure','scope','literature','approach','themes','synthesis','question','search','strategy','eligibility','criteria','screening','risk','assessment','evidence','meta','heterogeneity','publication','bias','pooled','bibliometric','database','query','dataset','tools','indicators','trends','leading','contributors','citation','keyword','cluster','hotspots','emerging','topics','development','validation','comparison','strengths','limitations','future','directions','critical','evaluation','notes'
      ]);

      let id=0,en=0;
      words.forEach(w=>{
        if(idWords.has(w))id+=2;
        if(enWords.has(w))en+=2;
        if(/^(meng|men|mem|ber|ter|di|ke|se|pe)[a-z]{4,}$/.test(w))id+=0.35;
        if(/(tion|ment|ness|ity|ous|ive|ally|ing|ed)$/.test(w))en+=0.25;

    function cleanArticleTtsTextV190_(text){
      return String(text||'')
        .replace(/<\/?mark\b[^>]*>/gi,'')
        .replace(/\s+/g,' ')

    }

    function naturalizeArticleTtsTextV192_(text,lang='id-ID'){
      const isId=String(lang||'').toLowerCase().startsWith('id');
      let t=cleanArticleTtsTextV190_(text);
      if(!t)return '';

      // Make visual/scientific punctuation audible instead of letting the voice rush through it.
      t=t
        .replace(/\s*(?:↔|⇄|⇌|⟷)\s*/g,isId?' berhubungan dengan ':' relates to ')
        .replace(/\s*(?:→|⇒|➜|➝|⟶|->)\s*/g,isId?' kemudian ':' then ')
        .replace(/\s*(?:←|⇐|⟵|<-)\s*/g,isId?' berasal dari ':' from ')
        .replace(/\s*[•●▪◦]\s*/g,'. ')
        .replace(/\s+[\/]\s+/g,isId?' atau ':' or ')
        .replace(/\bdan\s*\/\s*atau\b/gi,'dan atau')
        .replace(/\band\s*\/\s*or\b/gi,'and or')
        .replace(/\(([^()]{1,220})\)/g,', $1, ')
        .replace(/\[([^\[\]]{1,220})\]/g,', $1, ')
        .replace(/[–—]+/g,', ')
        .replace(/\s*;\s*/g,'; ')
        .replace(/\s*,\s*/g,', ')
        .replace(/\s*:\s*/g,': ')
        .replace(/\s+/g,' ')
        .trim();

      // Common mathematical/scientific symbols sound much clearer when expanded.
      const words=isId
        ? {percent:' persen', plusminus:' plus minus ', lte:' kurang dari atau sama dengan ', gte:' lebih dari atau sama dengan ', neq:' tidak sama dengan ', eq:' sama dengan ', lt:' kurang dari ', gt:' lebih dari ', times:' kali ', amp:' dan '}
        : {percent:' percent', plusminus:' plus or minus ', lte:' less than or equal to ', gte:' greater than or equal to ', neq:' not equal to ', eq:' equals ', lt:' less than ', gt:' greater than ', times:' times ', amp:' and '};
      t=t
        .replace(/%/g,words.percent)
        .replace(/±/g,words.plusminus)
        .replace(/≤/g,words.lte)
        .replace(/≥/g,words.gte)
        .replace(/≠/g,words.neq)
        .replace(/\s=\s/g,words.eq)
        .replace(/\s<\s/g,words.lt)
        .replace(/\s>\s/g,words.gt)
        .replace(/×/g,words.times)
        .replace(/\s&\s/g,words.amp)
        .replace(/\s+/g,' ')
        .replace(/\s+([,.!?;:])/g,'$1')
        .trim();

      // Explicit commas around parenthetical material create a short natural pause.
      return t.replace(/,{2,}/g,',').replace(/\.\s*,/g,'. ').trim();

    function splitArticleTtsChunksV190_(text,forcedLang=''){
      const clean=cleanArticleTtsTextV190_(text);
      if(!clean)return [];

      // Fewer speechSynthesis calls = less robotic stop/start between sentences.
      const units=clean.match(/[^.!?]+[.!?]?/g)||[clean];
      const out=[];
      let buffer='';
      let bufferLang='';

      const flush=()=>{
        const ready=String(buffer||'').trim();
        if(ready)out.push({text:ready,lang:bufferLang||forcedLang||detectArticleTtsLanguageV190_(ready)});
        buffer='';bufferLang='';
      };

      units.forEach(raw=>{
        const source=String(raw||'').trim();
        if(!source)return;
        const lang=forcedLang||detectArticleTtsLanguageV190_(source);
        const prepared=naturalizeArticleTtsTextV192_(source,lang);
        if(!prepared)return;

        // Keep a natural paragraph-like flow but avoid browser TTS problems on very long utterances.
        if(buffer && (bufferLang!==lang || (buffer.length+prepared.length+1)>520))flush();
        if(!buffer){buffer=prepared;bufferLang=lang}
        else buffer+=' '+prepared;

        if(buffer.length>430 && /[;:,.!?]$/.test(buffer))flush();
      });
      flush();

      // Last-resort split for unusually long strings without punctuation.
      const final=[];
      out.forEach(item=>{
        let phrase=item.text;
        while(phrase.length>560){
          let cut=Math.max(phrase.lastIndexOf('. ',520),phrase.lastIndexOf('; ',520),phrase.lastIndexOf(', ',500),phrase.lastIndexOf(' ',520));
          if(cut<180)cut=520;
          const part=phrase.slice(0,cut+1).trim();
          if(part)final.push({text:part,lang:item.lang});
          phrase=phrase.slice(cut+1).trim();
        }
        if(phrase)final.push({text:phrase,lang:item.lang});
      });
      return final;
    }

    function articleTtsSectionBodyV190_(section){

    function articleTtsAuthorFamilyNamesV190_(authors){
      const raw=cleanArticleTtsTextV190_(authors||'');
      if(!raw)return [];
      let parts=raw.split(/\s*[;|]\s*/).map(x=>x.trim()).filter(Boolean);
      if(parts.length===1 && /\s+and\s+/i.test(raw)){
        parts=raw.split(/\s+and\s+/i).map(x=>x.trim()).filter(Boolean);
      }
      const seen=new Set();
      return parts.map(name=>{
        // Support both "First Middle Last" and a conservative "Last, First" form.
        const comma=name.split(',').map(x=>x.trim()).filter(Boolean);
        if(comma.length>1 && comma[0].split(/\s+/).length<=2)return comma[0];
        const tokens=name.replace(/[()]/g,' ').split(/\s+/).map(x=>x.replace(/^[,.;:]+|[,.;:]+$/g,'')).filter(Boolean);
        const usable=tokens.filter(t=>!/^(?:dr|prof|ir|mr|mrs|ms)\.?$/i.test(t));
        return usable.length?usable[usable.length-1]:name;
      }).map(x=>x.replace(/[,.;:]+$/g,'').trim()).filter(x=>{
        const key=x.toLowerCase();
        if(!x||seen.has(key))return false;
        seen.add(key);return true;
      });

      const section=articleTtsV190.sections[index];

    function articleTtsApplySpeedWithoutSectionRestartV190_(){
      if(!articleTtsV190.speaking || articleTtsV190.paused)return;

      if(remaining)rest.unshift({text:remaining,lang:item.lang||detectArticleTtsLanguageV190_(remaining)});

      try{window.speechSynthesis.cancel()}catch(err){}

      articleTtsV190.queuePos=0;
      articleTtsV190.speaking=false;
      articleTtsV190.paused=false;
      articleTtsV190.currentUtterance=null;
      articleTtsV190.currentItem=null;

    function unifiedReadingHrefV140_(type,id){

      url.searchParams.set('surface',t);

    function renderReadingStatsV61_(stats){
      readingWeekStatsV61=stats||{};
      todayReadingSeconds=Math.max(
        0,
        Number(readingWeekStatsV61.todaySeconds||todayReadingSeconds)
      );

      const days=Array.isArray(readingWeekStatsV61.days)
        ? readingWeekStatsV61.days.slice(-7)
        : [];

      const maxMinutes=Math.max(
        60,
        ...days.map(d=>Math.max(0,Number(d.minutes||0)))
      );

      const bars=days.map(d=>{
        const mins=Math.max(0,Number(d.minutes||0));
        const height=Math.max(2,Math.round((mins/maxMinutes)*100));
        const color=readingBarColorV61_(mins);
        return `<div class="readingBarCol">
          <div class="readingBarValue">${esc(String(mins))} min</div>
          <div class="readingBarTrack" title="${esc(`${d.weekday||''}, ${d.dateLabel||''} · ${mins} min`)}">
            <div class="readingBarFill" style="height:${height}%;background:${color}"></div>
          </div>
          <div class="readingBarDay">${esc(d.weekday||'')}</div>
          <div class="readingBarDate">${esc(d.dateLabel||'')}</div>
        </div>`;
      }).join('');

      const average=Math.max(
        0,
        Number(readingWeekStatsV61.average7DaysMinutes||0)
      );

      return `
        <div class="readingStatsHead">
          <div>
            <h3 class="readingStatsTitle">Reading time · Last 7 days</h3>
            <div class="readingStatsSub">Green indicates reaching about 60 minutes or more per day.</div>
          </div>
          <button class="readingStatsClose" type="button" onclick="closeReadingStatsV61()" aria-label="Close">×</button>
        </div>
        <div class="readingChart">${bars}</div>
        <div class="readingWeeklyAverage">Weekly average · ${esc(String(average))} min/day</div>
        <div class="readingRankWrapV68">
          <div>
            <div class="readingRankTitleV68">Most read · Last 7 days</div>
            ${renderReadingRankListV68_(readingWeekStatsV61.topWeekly)}
          </div>
          <div>

      clearTimeout(readerPdfConfirmTimer);

      const email=document.getElementById('readerEmailBtn');
      const telegram=document.getElementById('readerTelegramBtn');

    function requestReaderPdfSend(channel,btn){
      if(!btn||readerPdfInProgress){
        if(readerPdfInProgress){
          toast('Reader PDF is already being processed.');
        }
        return;
      }

      const selection=getReaderPdfSelection();
      const selectedCount=readerSelectionMode==='projects'
        ?selection.projects.length
        :selection.paperIds.length;

      if(!selectedCount){
        toast(
          readerSelectionMode==='projects'
            ?'Select at least one project.'
            :'Select at least one paper.',
          'error'
        );
        return;
      }

      if(btn.dataset.confirm!=='1'){
        resetReaderPdfConfirmation();
        btn.dataset.confirm='1';
        btn.textContent=channel==='email'
          ?'Yes, generate & email'
          :'Yes, generate & Telegram';

        readerPdfConfirmTimer=setTimeout(
          resetReaderPdfConfirmation,
          10000
        );
        return;
      }

      clearTimeout(readerPdfConfirmTimer);

      const edition=String(
        document.getElementById('readerEditionInput')?.value||''
      ).trim()||readerDefaultEdition();

      const theme=getReaderPdfTheme();

      readerPdfInProgress=true;
      readerPdfChannelInProgress=channel;
      setReaderPdfBusyUi_();

      // V46: same UX as Add Reference. The server request runs asynchronously;
      // the user can keep browsing the Library while the Reader PDF is built.
      toast(
        `Reader PDF is being generated and sent to ${channel==='email'?'email':'Telegram'}. You can continue using the library.`
      );

      const runner=google.script.run
        .withSuccessHandler(res=>{
          readerPdfInProgress=false;
          readerPdfChannelInProgress='';
          resetReaderPdfConfirmation();

          toast(
            `Reader PDF sent to ${channel==='email'?'email':'Telegram'} · ${res.paperCount||0} papers · ${(res.theme||theme)==='light'?'Light':'Dark'}`
          );
        })
        .withFailureHandler(err=>{
          readerPdfInProgress=false;
          readerPdfChannelInProgress='';
          resetReaderPdfConfirmation();
          showErrorToast(err);
        });

      if(channel==='email'){
        runner.sendLiteratureReaderPdfToEmail(
          selection,
          edition,
          theme,
          ACCESS_KEY
        );
      }else{
        runner.sendLiteratureReaderPdfToTelegram(
          selection,
          edition,
          theme,
          ACCESS_KEY
        );
      }
    }

    function beginLastReadTracking_(paperId,preserveSession=false){

    function recordCompletedReadingMinuteV58_(){
      const t=lastReadTracker;
      if(
        !t.paperId ||
        t.writing ||
        (t.activeMs-t.reportedMs)<LAST_READ_THRESHOLD_MS
      )return;

      t.writing=true;
      const pid=t.paperId;

      google.script.run
        .withSuccessHandler(res=>{
          if(String(lastReadTracker.paperId||'').toUpperCase()!==String(pid).toUpperCase())return;

          lastReadTracker.reportedMs+=LAST_READ_THRESHOLD_MS;
          lastReadTracker.writing=false;

          const value=String(res&&res.Last_Read_At||'');
          todayReadingSeconds=Math.max(
            todayReadingSeconds,
            Number(res&&res.todaySeconds||todayReadingSeconds)
          );

          if(readingWeekStatsV61){
            readingWeekStatsV61.todaySeconds=todayReadingSeconds;
            const days=Array.isArray(readingWeekStatsV61.days)?readingWeekStatsV61.days:[];
            if(days.length){
              const today=days[days.length-1];
              today.seconds=todayReadingSeconds;
              today.minutes=Math.floor(todayReadingSeconds/60);
              const total=days.reduce((sum,d)=>sum+Math.max(0,Number(d.seconds||0)),0);
              readingWeekStatsV61.total7DaysSeconds=total;
              readingWeekStatsV61.average7DaysMinutes=Math.round(total/7/60);
            }
          }

          const row=allRecords.find(x=>
            String(x.Paper_ID||'').toUpperCase()===String(pid).toUpperCase()
          );
          if(row)row.Last_Read_At=value;

          if(
            currentPaper &&
            String(currentPaper.Paper_ID||'').toUpperCase()===String(pid).toUpperCase()
          ){
            currentPaper.Last_Read_At=value;
            currentPaper.Reading_Total_Seconds=Math.max(

              Number(res&&res.paperTotalSeconds||currentPaper.Reading_Total_Seconds||0)
            );
            updatePaperReadTimeLabelV68_(currentPaper.Reading_Total_Seconds);
          }

          if(shelfSortMode==='last_read')renderShelf(false);

          if((lastReadTracker.activeMs-lastReadTracker.reportedMs)>=LAST_READ_THRESHOLD_MS){
            recordCompletedReadingMinuteV58_();
          }
        })
        .withFailureHandler(()=>{
          if(String(lastReadTracker.paperId||'').toUpperCase()===String(pid).toUpperCase()){

          }
        })
        .recordLiteratureReadingMinuteForWeb(pid,60,ACCESS_KEY);
    }

    function tickLastReadTracker_(){
      const now=Date.now();
      const elapsed=Math.max(0,Math.min(now-lastReadTracker.lastTick,1500));
      lastReadTracker.lastTick=now;

      const pid=String(lastReadTracker.paperId||'');
      const stillOpen=
        pid &&
        selectedId &&
        currentPaper &&
        (readingSurfaceModeV62==='article'||readingSurfaceModeV62==='drive') &&
        String(selectedId).toUpperCase()===pid.toUpperCase() &&
        String(currentPaper.Paper_ID||'').toUpperCase()===pid.toUpperCase();

      if(stillOpen && document.visibilityState==='visible'){
        lastReadTracker.sessionVisibleMs+=elapsed;

        if(!lastReadTracker.qualified){

            // Once the session qualifies, include the first 6 seconds too.
            lastReadTracker.activeMs=lastReadTracker.sessionVisibleMs;

      let cursor=0;

    function positionHighlightToolbarV62_(rect){
      const toolbar=document.getElementById('highlightToolbarV62');
      if(!toolbar||!rect)return;

      toolbar.style.visibility='hidden';
      toolbar.classList.add('show');

      // V82: position remains viewport-based, but its coordinates are always
      // recalculated from the selected text / mark. There is intentionally no
      // vertical clamping or flip-to-below behaviour: if the selected text
      // scrolls out of view, the toolbar scrolls out with it instead of sticking
      // to the screen edge.
      const width=toolbar.offsetWidth||110;
      const height=toolbar.offsetHeight||38;
      const viewportWidth=Math.max(1,window.innerWidth||document.documentElement.clientWidth||0);
      const viewportHeight=Math.max(1,window.innerHeight||document.documentElement.clientHeight||0);
      const header=document.querySelector('.topbar');
      const headerBottom=header?Math.max(0,header.getBoundingClientRect().bottom):0;

      if(rect.bottom<=headerBottom+2||rect.top>=viewportHeight-2){
        toolbar.style.visibility='hidden';
        return;
      }

      const left=Math.max(8,Math.min(viewportWidth-width-8,rect.left+(rect.width-width)/2));
      const above=rect.top-height-8;
      const below=rect.bottom+8;
      let top=above;

      if(above<headerBottom+6){
        if(below+height<=viewportHeight-8)top=below;
        else{
          toolbar.style.visibility='hidden';
          return;
        }
      }

      toolbar.style.left=`${Math.round(left)}px`;
      toolbar.style.top=`${Math.round(top)}px`;
      toolbar.style.visibility='visible';
    }

    function selectionOverlapsStoredMarkV80_(container,start,end){
      return [...container.querySelectorAll('mark.readerHighlightV62')].some(mark=>{
        const markRange=document.createRange();
        markRange.selectNodeContents(mark);
        const markStart=computeSelectionOffsetV62_(container,markRange.startContainer,markRange.startOffset);
        const markEnd=computeSelectionOffsetV62_(container,markRange.endContainer,markRange.endOffset);
        return start<markEnd && end>markStart;

    function inspectTextSelectionV62_(){
      // V82: busy operations keep their saved text/mark anchor. Scroll events
      // reposition the toolbar from that anchor; selectionchange must not replace it.
      if(highlightToolbarBusyLockV82)return;

      // A clicked <mark> owns the toolbar until the user clicks elsewhere.
      // This prevents the collapsed selectionchange generated by the click from
      // immediately hiding the Remove Highlight button.
      if(highlightToolbarModeV82==='remove'||highlightToolbarModeV82==='remove-pending')return;

      // Keep the existing selection toolbar behaviour; only storage changed in V80.
      if(readingSurfaceModeV62!=='article'){
        if(selectionTimerV62)clearTimeout(selectionTimerV62);
        pendingHighlightV62=null;
        hideHighlightToolbarV62_();
        return;
      }

      clearTimeout(selectionTimerV62);
      selectionTimerV62=setTimeout(()=>{
        const selection=window.getSelection&&window.getSelection();
        if(!selection||selection.rangeCount<1||selection.isCollapsed){
          pendingHighlightV62=null;
          hideHighlightToolbarV62_();
          return;
        }

        const range=selection.getRangeAt(0);
        const startContainer=getHighlightContainerV62_(range.startContainer);
        const endContainer=getHighlightContainerV62_(range.endContainer);

        if(!startContainer||startContainer!==endContainer){
          pendingHighlightV62=null;
          hideHighlightToolbarV62_();
          return;
        }

        let start=computeSelectionOffsetV62_(startContainer,range.startContainer,range.startOffset);
        let end=computeSelectionOffsetV62_(startContainer,range.endContainer,range.endOffset);
        if(start<0||end<=start){
          pendingHighlightV62=null;
          hideHighlightToolbarV62_();
          return;
        }

        let selected=range.toString();
        const lead=(selected.match(/^\s+/)||[''])[0].length;
        const trail=(selected.match(/\s+$/)||[''])[0].length;
        start+=lead;
        end-=trail;
        selected=selected.slice(lead,selected.length-trail||undefined);

        if(!selected||end<=start){
          pendingHighlightV62=null;
          hideHighlightToolbarV62_();
          return;
        }

        pendingHighlightV62={
          paperId:String(currentPaper&&currentPaper.Paper_ID||''),
          fieldKey:String(startContainer.dataset.highlightField||''),
          start:start,
          end:end,
          text:selected,
          overlaps:selectionOverlapsStoredMarkV80_(startContainer,start,end)
        };

        highlightToolbarModeV82='highlight';
        setHighlightToolbarRangeAnchorV82_(range);

        const toolbar=document.getElementById('highlightToolbarV62');
        if(toolbar){
          toolbar.innerHTML=`<button type="button" onpointerdown="event.preventDefault()" onclick="savePendingHighlightV62(this)">Highlight</button>`;
          positionHighlightToolbarV62_(getHighlightToolbarAnchorRectV82_()||range.getBoundingClientRect());
        }
      },120);
    }

    function getAllProjectNames(){
      const seen=new Set(),out=[];
      allRecords.forEach(p=>splitTags(p.Collections).forEach(name=>{
        const key=norm(name).trim();
        if(key&&!seen.has(key)){seen.add(key);out.push(name)}
      }));
      return out.sort((a,b)=>a.localeCompare(b));
    }

    function renderProjects(p){
      const paperIdEnc=encodeURIComponent(String(p.Paper_ID||''));
      const projects=splitTags(p.Collections);
      const chips=projects.length?projects.map(name=>{
        const enc=encodeURIComponent(name);
        return `<span class="projectChip">${esc(name)}<button class="projectRemove" title="Remove from project" aria-label="Remove ${esc(name)} from project" onclick="removeProjectFromPaper(decodeURIComponent('${paperIdEnc}'),decodeURIComponent('${enc}'),this)">×</button></span>`;

    function showProjectEditor(){
      const view=document.getElementById('projectView'),editor=document.getElementById('projectEditor'),input=document.getElementById('projectInput');
      if(view)view.style.display='none';
      if(editor)editor.style.display='flex';
      if(input)setTimeout(()=>input.focus(),20);

    function cancelProjectEditor(){
      const view=document.getElementById('projectView'),editor=document.getElementById('projectEditor'),input=document.getElementById('projectInput');
      if(editor)editor.style.display='none';
      if(view)view.style.display='flex';
      if(input)input.value='';

    function updateLocalProjects(paperId,collections){
      const row=allRecords.find(x=>String(x.Paper_ID||'').toUpperCase()===String(paperId||'').toUpperCase());
      if(row)row.Collections=collections||'';
      if(currentPaper&&String(currentPaper.Paper_ID||'').toUpperCase()===String(paperId||'').toUpperCase())currentPaper.Collections=collections||'';
      refreshProjectFilter();
      renderShelf(false);
    }

    function refreshProjectFilter(){
      const el=document.getElementById('project');
      if(!el)return;
      const previous=el.value;
      el.innerHTML='<option value="">All projects</option>';
      getAllProjectNames().forEach(name=>{
        const op=document.createElement('option');op.value=name;op.textContent=name;el.appendChild(op);
      });
      if(Array.from(el.options).some(o=>o.value===previous))el.value=previous;
    }

    function addProjectToPaper(paperId,btn){
      const input=document.getElementById('projectInput');
      const project=String(input?input.value:'').trim();
      if(!project)return;
      if(!setActionButtonBusyV69_(btn,true,'Adding…'))return;
      showLoader();
      google.script.run.withSuccessHandler(res=>{
        updateLocalProjects(paperId,res.Collections||'');
        toast('Added to project');
        renderBookPreserveLiveScroll(currentPaper);
        hideLoader();
      }).withFailureHandler(err=>{
        setActionButtonBusyV69_(btn,false);
        showError(err);
      }).addLiteratureProjectForWeb(paperId,project,ACCESS_KEY);
    }

    function removeProjectFromPaper(paperId,project,btn){
      if(!paperId||!project)return;
      if(!setActionButtonBusyV69_(btn,true,'…'))return;
      showLoader();
      google.script.run.withSuccessHandler(res=>{
        updateLocalProjects(paperId,res.Collections||'');
        toast('Removed from project');
        renderBookPreserveLiveScroll(currentPaper);
        hideLoader();
      }).withFailureHandler(err=>{
        setActionButtonBusyV69_(btn,false);
        showError(err);
      }).removeLiteratureProjectForWeb(paperId,project,ACCESS_KEY);
    }

    function setPaperReadStatus(paperId,read){
      if(!paperId)return;

      const status=read?'READ':'UNREAD';
      const previousCurrent=currentPaper?currentPaper.Read_Status:'';
      const row=allRecords.find(x=>String(x.Paper_ID||'').toUpperCase()===String(paperId||'').toUpperCase());
      const previousRow=row?row.Read_Status:'';

      if(row)row.Read_Status=status;
      if(currentPaper&&String(currentPaper.Paper_ID||'').toUpperCase()===String(paperId||'').toUpperCase()){
        currentPaper.Read_Status=status;
      }

      renderShelf(false);
      if(currentPaper)renderBookPreserveLiveScroll(currentPaper);

      google.script.run.withSuccessHandler(res=>{
        const finalStatus=String(res&&res.Read_Status||status).toUpperCase()==='READ'?'READ':'UNREAD';
        if(row)row.Read_Status=finalStatus;
        if(currentPaper&&String(currentPaper.Paper_ID||'').toUpperCase()===String(paperId||'').toUpperCase()){
          currentPaper.Read_Status=finalStatus;
        }
        renderShelf(false);
        toast(finalStatus==='READ'?'Marked as read 📖':'Marked as unread 📘');
      }).withFailureHandler(err=>{
        if(row)row.Read_Status=previousRow;
        if(currentPaper&&String(currentPaper.Paper_ID||'').toUpperCase()===String(paperId||'').toUpperCase()){
          currentPaper.Read_Status=previousCurrent;
          renderBookPreserveLiveScroll(currentPaper);
        }
        renderShelf(false);
        showErrorToast(err);
      }).setLiteratureReadStatusForWeb(paperId,read,ACCESS_KEY);
    }

        if(type==='text')return `<div class="field ${full?'full':''}"><label>${esc(label)}</label><input data-edit-field="${esc(field)}" value="${esc(val)}"></div>`;
        if(type==='select'){
          const current=normalizeArticleType(val);

          return `<div class="field ${full?'full':''}"><label>${esc(label)}</label><select data-edit-field="${esc(field)}">${options}</select></div>`;
        }
        return `<div class="field ${full?'full':''}"><label>${esc(label)}</label><textarea class="${type==='long'?'long':''}" data-edit-field="${esc(field)}">${esc(val)}</textarea></div>`;
      };

      showLoader();

        const changedValues=res&&res.Updates&&typeof res.Updates==='object'?res.Updates:{};
        if(currentPaper&&String(currentPaper.Paper_ID||'').toUpperCase()===paperId.toUpperCase()){
          Object.keys(changedValues).forEach(key=>{ currentPaper[key]=changedValues[key]; });
          const row=allRecords.find(x=>String(x.Paper_ID||'').toUpperCase()===paperId.toUpperCase());
          if(row){
            ['Title','Authors','Year','Journal','Article_Type','Keywords','Collections','Favorite'].forEach(key=>{
              if(Object.prototype.hasOwnProperty.call(changedValues,key))row[key]=(key==='Title'?stripMarkTagsV80(changedValues[key]):changedValues[key]);
            });
            if(Object.prototype.hasOwnProperty.call(changedValues,'Objective')){
              row.Objective_Preview=stripMarkTagsV80(changedValues.Objective||'').slice(0,180);
            }

          updateLocalActivityV69_(paperId,res,'Reference updated');
          renderShelf(false);
          renderBook(currentPaper);
        }else{
          openPaper(paperId,true);

        toast(`Saved · ${res.changed||0} fields changed`);
        hideLoader();
      }).withFailureHandler(err=>{
        setActionButtonBusyV69_(btn,false);
        showError(err);
      }).updateLiteraturePaperFieldsForWeb(paperId,updates,ACCESS_KEY);
    }

    function createDownloadFromBase64_(payload){
      const b64=String(payload&&payload.base64||'');
      const fileName=String(payload&&payload.fileName||'Paper_Archive.xlsx');
      const mimeType=String(payload&&payload.mimeType||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      if(!b64)throw new Error('Download payload kosong.');

      const binary=atob(b64);
      const len=binary.length;
      const bytes=new Uint8Array(len);
      for(let i=0;i<len;i++)bytes[i]=binary.charCodeAt(i);

      const blob=new Blob([bytes],{type:mimeType});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
    }

    function showExportOptions(paperId){
      const group=document.getElementById('exportActionGroup');
      if(!paperId||!group)return;
      clearTimeout(exportActionResetTimer);
      const pid=encodeURIComponent(String(paperId));

      if(isCompactMode()){
        showExportConfirmation(paperId,'telegram');
        return;
      }

      group.innerHTML=`
        <button class="exportChoiceBtn" onclick="showExportConfirmation(decodeURIComponent('${pid}'),'download')">Download</button>

    }

    function showExportConfirmation(paperId,channel){
      const group=document.getElementById('exportActionGroup');
      if(!paperId||!group)return;
      clearTimeout(exportActionResetTimer);
      const pid=encodeURIComponent(String(paperId));
      const safeChannel=channel==='download'?'download':'telegram';
      const label=safeChannel==='download'?'Yes, download':'Yes, send to Telegram';
      group.innerHTML=`<button class="exportChoiceBtn" onclick="confirmArticleExport(decodeURIComponent('${pid}'),'${safeChannel}',this)">${label}</button>`;
      scheduleExportReset(paperId);
    }

    function confirmArticleExport(paperId,channel,btn){
      if(!paperId||!btn)return;
      clearTimeout(exportActionResetTimer);
      btn.textContent=channel==='download'?'Preparing…':'Sending…';
      btn.disabled=true;

      const runner=google.script.run.withSuccessHandler(result=>{
        try{
          if(channel==='download'){
            createDownloadFromBase64_(result||{});
            toast('Excel download started');
          }else{
            toast('Excel sent to Telegram');
          }
        }catch(err){
          showErrorToast(err);
        }finally{
          resetExportActions(paperId);
        }
      }).withFailureHandler(err=>{
        resetExportActions(paperId);
        showErrorToast(err);
      });

      if(channel==='download'){
        runner.downloadLiteraturePaperForWeb(paperId,ACCESS_KEY);
      }else{
        runner.sendLiteraturePaperToTelegram(paperId,ACCESS_KEY);
      }
    }
    let deleteReferenceResetTimer=null;
    function cycleDeleteReference(paperId,btn){
      if(!paperId||!btn)return;
      const stage=Number(btn.dataset.deleteStage||0);

      if(stage===0){
        btn.dataset.deleteStage='1';
        btn.textContent='Confirm delete';
        btn.classList.add('stage1');
        resetDeleteReferenceTimer(btn);
        return;
      }

      if(stage===1){
        btn.dataset.deleteStage='2';
        btn.textContent='Yes, delete permanently';
        btn.classList.remove('stage1');
        btn.classList.add('stage2');
        resetDeleteReferenceTimer(btn);
        return;
      }

      clearTimeout(deleteReferenceResetTimer);
      btn.textContent='Deleting…';
      btn.classList.add('deleting');
      showLoader();
      google.script.run.withSuccessHandler(res=>{
        hideLoader();
        toast(`${paperId} deleted`);
        selectedId='';
        currentPaper=null;
        openHomeOnNextInit=true;
        setTimeout(()=>load(),450);
      }).withFailureHandler(err=>{
        hideLoader();
        resetDeleteReferenceButton(btn);
        showErrorToast(err);
      }).deleteLiteratureReferenceForWeb(paperId,ACCESS_KEY);
