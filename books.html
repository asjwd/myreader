<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      color-scheme:dark;
      --bg:#111315;
      --paper:#181b1e;
      --paper2:#202428;
      --ink:#eef0ed;
      --muted:#9da39f;
      --line:#30363a;
      --accent:#8fb6a0;
      --accentStrong:#b6d7c2;
      --danger:#d78f8f;
      --shadow:0 14px 36px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    button{touch-action:manipulation}
    .topbar{
      position:sticky;top:0;z-index:2000;
      background:rgba(17,19,21,.96);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);padding:14px 18px
    }
    .toprow,.searchrow{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px}
    .toprow{justify-content:space-between}
    .brand h1{margin:0;font:700 21px Georgia,serif}
    .brand small{display:block;color:var(--muted);margin-top:3px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--line);background:var(--paper2);color:var(--ink);
      padding:9px 12px;border-radius:10px;cursor:pointer
    }
    .btn:hover{border-color:var(--accent);color:var(--accentStrong)}
    .btn.primary{background:var(--accentStrong);border-color:var(--accentStrong);color:#152019;font-weight:700}
    .btn.danger{color:var(--danger)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .searchrow{margin-top:11px}
    input,select,textarea{
      width:100%;border:1px solid var(--line);border-radius:10px;
      background:var(--paper2);color:var(--ink);padding:10px 12px;outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    .layout{
      max-width:1320px;margin:18px auto 42px;padding:0 18px;
      display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start
    }
    .panel{
      background:var(--paper);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow);min-width:0
    }
    .shelfPanel{padding:12px;position:sticky;top:118px;max-height:calc(100vh - 142px);overflow:auto}
    .shelfHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .count{font-size:13px;color:var(--muted)}
    .bookList{display:flex;flex-direction:column;gap:8px}
    .bookCard{
      width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);color:var(--ink);
      border-radius:11px;padding:11px;cursor:pointer
    }
    .bookCard:hover,.bookCard.active{border-color:var(--accent)}
    .bookId{font-size:12px;color:var(--accentStrong);font-weight:700}
    .bookTitle{font-weight:700;margin:4px 0 3px;line-height:1.35}
    .bookMeta{font-size:12px;color:var(--muted);line-height:1.4}
    .contentPanel{min-height:520px;padding:20px}
    .home{padding:24px 10px;text-align:center;color:var(--muted)}
    .home h2{color:var(--ink);font:700 28px Georgia,serif;margin:0 0 8px}
    .readerHeader{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px}
    .readerHeader h2{margin:0;font:700 27px Georgia,serif;line-height:1.2}
    .readerMeta{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.5}
    /* V79 reader:
       One reading column only.
       Chapter expands inline; each Page shows its translation.
       Clicking the Page label toggles the original screenshot inline. */
    .readerBody{
      display:block;
      margin-top:18px
    }
    .outline{
      border:0;
      border-radius:0;
      background:transparent;
      padding:0;
      min-height:260px;
      max-height:none;
      overflow:visible
    }
    .outline ul{list-style:none;margin:0;padding:0}

    .readerChildren{
      padding:0!important;
      border-left:0!important;
      margin:0!important
    }

    .sectionNodeV79{
      margin:0 0 18px
    }
    .sectionRow{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:42px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
      font-weight:700;
      cursor:pointer;
      user-select:none
    }
    .sectionRow:hover .nodeLabel{color:var(--accentStrong)}
    .sectionRow .nodeLabel{
      font:700 22px/1.25 Georgia,serif;
      white-space:normal;
      overflow:visible;
      text-overflow:clip
    }
    .toggle{
      width:18px;
      color:var(--muted);
      text-align:center;
      flex:0 0 18px
    }
    .nodeLabel{min-width:0}

    .pageNodeV79{
      margin:14px 0;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--paper2);
      overflow:hidden
    }
    .pageRowV79{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:42px;
      padding:10px 13px;
      border-bottom:1px solid var(--line)
    }
    .pageLabelBtnV79{
      border:0;
      background:transparent;
      color:var(--accentStrong);
      padding:0;
      margin:0;
      cursor:pointer;
      font:700 13px Georgia,serif;
      text-align:left
    }
    .pageLabelBtnV79:hover{
      color:var(--ink);
      text-decoration:underline;
      text-underline-offset:3px
    }
    .pageStatus{
      margin-left:auto;
      font-size:10px;
      color:var(--muted);
      white-space:nowrap
    }

    .inlineTranslationV79{
      padding:14px 15px 16px;
      white-space:pre-wrap;
      line-height:1.72;
      font-size:14px;
      color:var(--ink)
    }
    .inlineTranslationV79.empty{
      color:var(--muted);
      font-style:italic
    }

    .inlineScreenshotV79{
      width:100%;
      border-bottom:1px solid var(--line);
      background:#0c0e0f;
      min-height:90px;
      max-height:72vh;
      overflow-y:auto;
      overflow-x:hidden;
      display:block;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      scrollbar-gutter:stable
    }
    .inlineScreenshotV79 img{
      display:block;
      width:100%;
      max-width:none;
      height:auto;
      max-height:none;
      object-fit:contain;
      margin:0
    }
    .inlineScreenshotLoadingV79{
      min-height:90px;
      padding:18px;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-size:11px
    }
    .inlineTranslationLoadingV79{
      padding:10px 2px 2px;
      color:var(--muted);
      font-size:11px
    }

    .emptyNode{padding:12px 0;color:var(--muted);font-size:13px}

    /* Manage Pagination remains the structural tree/editor. */
    .manageOutline{
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--paper2);
      padding:8px
    }

    .placeholder{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
    .pageHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
    .pageHead h3{margin:0;font:700 22px Georgia,serif}
    .statusChip{font-size:11px;padding:5px 8px;border-radius:99px;background:#29352f;color:var(--accentStrong)}
    details{
      border:1px solid var(--line);background:var(--paper2);border-radius:12px;
      margin:10px 0;overflow:hidden
    }
    summary{cursor:pointer;padding:11px 13px;font-weight:700;user-select:none}
    .detailBody{padding:0 13px 13px}
    .screenshotWrap{
      min-height:80px;display:flex;justify-content:center;align-items:center;
      border-top:1px solid var(--line);background:#0c0e0f
    }
    .screenshotWrap img{display:block;max-width:100%;height:auto;max-height:75vh;object-fit:contain}
    .textBlock{white-space:pre-wrap;line-height:1.7;font-size:14px}
    .translation{font-size:15px}
    .muted{color:var(--muted)}
    .loader{padding:25px;text-align:center;color:var(--muted)}
    .errorBox{padding:16px;border:1px solid #653c3c;border-radius:12px;background:#2b1e1e;color:#f0b5b5}
    .toast{
      position:fixed;right:18px;bottom:18px;z-index:100;
      background:#22282b;color:var(--ink);border:1px solid var(--line);border-radius:10px;
      padding:10px 12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);
      pointer-events:none;transition:.18s
    }
    .toast.show{opacity:1;transform:none}
    .toast.error{border-color:#653c3c;color:#f0b5b5}
    .manageBanner{
      margin:14px 0 0;padding:10px 12px;border:1px solid #4a5a50;
      background:#1d2822;border-radius:10px;color:#cfe2d6;font-size:13px;
      display:flex;align-items:center;justify-content:space-between;gap:14px
    }
    .manageBannerTextV84{min-width:0;line-height:1.45}
    .manageBannerActionsV84{
      flex:0 0 auto;display:flex;align-items:center;gap:8px
    }
    .selectedPagesCountV84{
      display:none;color:var(--accentStrong);font-size:10px;white-space:nowrap
    }
    .selectedPagesCountV84.show{display:inline-block}

    .pageSelectWrapV84{
      width:22px;height:22px;display:grid;place-items:center;flex:0 0 22px;
      cursor:pointer
    }
    .pageSelectV84{
      width:15px;height:15px;margin:0;accent-color:var(--accent);
      cursor:pointer
    }
    .structureNode.pageNodeV80.multiSelectedV84>.structureNodeRow.page{
      border-color:var(--accent);
      background:#29352f;
      box-shadow:0 0 0 1px rgba(143,182,160,.22) inset
    }
    .structureNode.pageNodeV80.multiDraggingV84>.structureNodeRow.page{
      opacity:.72
    }
    .multiDragBadgeV84{
      position:fixed;z-index:9999;pointer-events:none;display:none;
      border:1px solid var(--accent);border-radius:999px;
      background:var(--paper);color:var(--accentStrong);
      padding:5px 9px;font-size:10px;font-weight:700;
      box-shadow:var(--shadow)
    }
    .multiDragBadgeV84.show{display:block}

    @media(max-width:640px){
      .manageBanner{align-items:flex-start}
      .manageBannerActionsV84{flex-direction:column;align-items:flex-end}
    }
    .manageOutline{max-height:none}

    /* V80: tree-like pagination editor */
    .structureRoot,.structureList{list-style:none;margin:0;padding:0}
    .structureRoot.dropList{
      margin-left:0;
      padding-left:0;
      border-left:0
    }
    .structureList.dropList{
      position:relative;
      min-height:12px;
      margin:6px 0 8px 18px;
      padding:2px 0 2px 18px;
      border-left:2px solid rgba(143,182,160,.34)
    }
    .structureList.dropList::before{
      content:"";
      position:absolute;
      top:13px;
      left:0;
      width:11px;
      border-top:2px solid rgba(143,182,160,.34)
    }

    .structureNode{
      position:relative;
      margin:6px 0
    }
    .structureNodeRow{
      display:flex;
      align-items:center;
      gap:8px;
      min-height:40px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:9px;
      background:#24292d
    }
    .structureNodeRow.section{
      font-weight:700;
      background:#1d2822;
      border-color:#405347
    }
    .structureNodeRow.page{
      margin-left:0;
      background:#22272a;
      border-color:#333a3e
    }
    .structureNode.newSectionNodeV80>.structureNodeRow.section{
      border-style:dashed;
      border-color:var(--accent)
    }
    .dragHandle{
      cursor:grab;color:var(--muted);font-size:17px;touch-action:none;
      flex:0 0 auto
    }
    .dragHandle:active{cursor:grabbing}
    .structureType{
      margin-left:auto;
      flex:0 0 auto;
      border-radius:999px;
      padding:3px 7px;
      font-size:9px;
      letter-spacing:.05em;
      color:var(--muted);
      background:rgba(255,255,255,.035)
    }
    .structureNodeRow.section .structureType{
      color:var(--accentStrong);
      background:rgba(143,182,160,.08)
    }
    .sortableGhost{opacity:.35}
    .sortableChosen>.structureNodeRow{border-color:var(--accent)}
    .dropList{min-height:10px}

    .addSectionBtnV80{
      border:1px solid var(--accent);
      background:transparent;
      color:var(--accentStrong);
      border-radius:8px;
      padding:7px 11px;
      cursor:pointer;
      font-size:11px;
      font-weight:700
    }
    .addSectionBtnV80:hover{
      background:rgba(143,182,160,.06);
      border-color:var(--accentStrong);
      color:var(--ink)
    }
    .modalBackdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2800;
      display:none;align-items:flex-start;justify-content:center;padding:18px;
      overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch
    }
    .modalBackdrop.show{display:flex}
    .modal{
      width:min(560px,100%);background:var(--paper);border:1px solid var(--line);
      border-radius:14px;padding:18px;box-shadow:var(--shadow);margin:auto 0
    }
    .modal h3{margin:0 0 15px;font:700 23px Georgia,serif}
    .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .formGrid .wide{grid-column:1/-1}
    .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
    .modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    @media(max-width:880px){
      .layout{grid-template-columns:1fr}
      .shelfPanel{position:static;max-height:none}
      .readerBody{display:block}
      .outline{max-height:none}
    }
    @media(max-width:560px){
      .toprow{align-items:flex-start}
      .brand h1{font-size:18px}
      .layout{padding:0 10px}
      .topbar{padding:12px 10px}
      .contentPanel{padding:14px}
      .readerHeader{flex-direction:column}
      .formGrid{grid-template-columns:1fr}
      .formGrid .wide{grid-column:auto}
    }
  
    /* V47 — visually align Books Library with Annotated Bibliography */
    .libraryAppRoot{display:none}
    body.fastAuthPendingV117 .libraryAppRoot{display:block}
    body.fastAuthPendingV117 .deviceGate{display:none!important}
    body.deviceAuthorized .libraryAppRoot{display:block}

    .deviceGate{
      position:fixed;inset:0;z-index:1000;background:#101315;
      display:flex;align-items:center;justify-content:center;padding:22px
    }
    .deviceGate.hidden{display:none}
    .deviceGateCard{
      width:min(440px,100%);background:var(--paper);border:1px solid var(--line);
      border-radius:14px;padding:24px;box-shadow:var(--shadow)
    }
    .deviceGateBrand{font:700 22px Georgia,serif;margin:0 0 7px;color:var(--ink)}
    .deviceGateText{font-size:12px;line-height:1.55;color:var(--muted);margin:0}
    .deviceGateStatus{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45}
    .deviceGateStatus.error{color:#e8a0a0}

    .toprow{max-width:1280px}
    .searchrow{max-width:1280px}
    .layout{
      max-width:1280px;
      grid-template-columns:390px minmax(0,1fr);
    }

    .brandBtn{
      appearance:none;border:0;background:transparent;color:var(--ink);
      padding:0;margin:0;cursor:pointer;text-align:left
    }
    .brandBtn h1{margin:0;font:700 21px Georgia,serif}
    .brandBtn:hover h1{color:var(--accentStrong)}

    .shelfPanel{
      padding:0;background:transparent;border:0;box-shadow:none;
      position:static;max-height:none;overflow:visible
    }
    .shelfToolbar{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      margin:0 0 9px;padding:0 1px
    }
    .shelfCountGroup{display:flex;align-items:center;gap:4px;min-width:0}
    .shelfCount{color:var(--muted);font-size:11px;white-space:nowrap}
    .shelfRefreshBtn{
      width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto;
      border:1px solid transparent;border-radius:7px;background:transparent;
      color:var(--accentStrong);cursor:pointer;padding:0;font-size:15px;line-height:1
    }
    .shelfRefreshBtn:hover{
      border-color:var(--line);background:rgba(143,182,160,.05);color:var(--ink)
    }
    .shelfRefreshBtn:disabled{cursor:default;opacity:.65}
    .shelfRefreshBtn.refreshing .refreshGlyph{
      display:inline-block;animation:refreshSpinV47 .7s linear infinite
    }
    @keyframes refreshSpinV47{to{transform:rotate(360deg)}}

    .bookList{
      display:flex;flex-direction:column;gap:10px;
      max-height:calc(100vh - 205px);overflow:auto;padding-right:3px
    }
    .bookCard{
      background:var(--paper);border:1px solid var(--line);border-radius:12px;
      padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.14);transition:.12s ease
    }
    .bookCard:hover{transform:translateY(-1px);border-color:#58616a}
    .bookCard.active{
      border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset
    }
    .bookId{color:var(--muted);font-size:12px;letter-spacing:.04em}
    .bookTitle{margin:5px 0 6px;font:700 16px/1.35 Georgia,serif}
    .bookMeta{color:var(--muted);font-size:12px;line-height:1.5}

    .contentPanel{
      position:relative;min-height:70vh;background:var(--paper);
      border:1px solid var(--line);border-radius:14px;
      padding:clamp(22px,4vw,48px);box-shadow:var(--shadow)
    }

    .home{
      max-width:920px;margin:-8px auto 0;min-height:calc(70vh - 42px);
      display:flex;flex-direction:column;padding:0;text-align:left
    }
    .homeTop{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding-bottom:15px;border-bottom:1px solid var(--line)
    }
    .homeTitle{margin:0;font:700 25px Georgia,serif;color:var(--ink)}
    .homeHeroMeta{color:var(--muted);font-size:14px;margin-top:5px}
    .homeTopActions{display:flex;align-items:center;gap:8px;justify-content:flex-end}
    .homeAddBookBtn{
      border:1px solid var(--accent);background:transparent;color:var(--accentStrong);
      border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11px;
      font-weight:650;white-space:nowrap
    }
    .homeAddBookBtn:hover{
      background:rgba(143,182,160,.06);border-color:var(--accentStrong);color:var(--ink)
    }
    .homeBody{padding:22px 0;color:var(--muted);font-size:13px;line-height:1.65}

    .readerHeader .btn{
      border:1px solid var(--line);border-radius:8px;padding:7px 11px;
      background:var(--paper);color:var(--ink);font-size:11px
    }
    .readerHeader .btn:hover{border-color:var(--accent);color:var(--accentStrong)}
    .readerHeader .btn.primary{
      background:var(--accent);color:#101713;border-color:var(--accent);font-weight:700
    }

    @media(max-width:900px),(orientation:portrait) and (max-width:1100px){
      .layout{grid-template-columns:1fr}
      .bookList{max-height:none;overflow:visible}
    }

    /* V75 — Book Archive upload, matching Article Add flow */
    .addBookWrap{max-width:860px;margin:0 auto}
    .addBookHead{position:relative;border-bottom:1px solid var(--line);padding:0 44px 14px 0;margin-bottom:20px}
    .addBookHead h2{margin:0 0 6px;font:700 25px Georgia,serif}
