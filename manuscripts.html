        );

function deleteTaskV153_(id) {

        !currentProject ||
        !currentProject.project
    ) {

    var task =
        (currentProject.tasks || [])
          .find(function (t) {
            return t.Project_Task_ID === id;

        return;

        !confirm(

function captureProjectNewTaskDraftV157_() {
    if (!taskEditorOpenV122)
        return;

    var title = document.getElementById('taskTitleInlineV122');
    var due = document.getElementById('taskDueInlineV122');

    if (title)
        projectNewTaskDraftV157_.title = String(title.value || '');

    var active = document.activeElement;

var projectOpenSeqV161_ = 0;

function openProjectV161_(id) {
    var pid =

    if (!pid)

        ++projectOpenSeqV161_;

    var previousCurrent =
        currentProject;

    var previousHomeClass =
        document.body.classList.contains(
            'projectHomeOpenV122'

    // Keep the current screen in place while loading, exactly like Article.
    // Only the selected card + top spinner changes before CORE arrives.
    currentProject = null;

    showProjectTopLoaderV115();

    google.script.run
        .withSuccessHandler(
            function (core) {
                if (
                    seq !==

                    return;
                }

                pendingProjectIdV115 = '';

                currentProject =
                    Object.assign(
                        {},

                // References / Submission History / Tasks stay deferred.
                loadProjectDeferredV119_(
                    pid

            }
        )
        .withFailureHandler(
            function (err) {
                if (
                    seq !==
                    projectOpenSeqV161_
                ) {
                    return;
                }

                finishProjectRequestV115();
                pendingProjectIdV115 = '';
                currentProject =
                    previousCurrent;

                if (previousHomeClass) {
                    document.body.classList.add(
                        'projectHomeOpenV122'
                    );
                    document.body.classList.remove(
                        'projectDetailOpenV108'

        )

function formatSubmissionDateV162_(value) {
    var raw = String(value || '').trim();
    if (!raw)
        return '';

    var match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
        var months = [
          'Jan','Feb','Mar','Apr','May','Jun',
          'Jul','Aug','Sep','Oct','Nov','Dec'
        ];
        var monthIndex = Number(match[2]) - 1;
        var day = Number(match[3]);

        if (
            monthIndex >= 0 &&
            monthIndex < 12 &&
            day >= 1 &&
            day <= 31
        ) {
            return (
              String(day) +
              ' ' +
              months[monthIndex] +
              ' ' +
              match[1]
            );
        }
    }

    var d = new Date(raw);
    if (!Number.isNaN(d.getTime())) {
        var fallbackMonths = [
          'Jan','Feb','Mar','Apr','May','Jun',
          'Jul','Aug','Sep','Oct','Nov','Dec'
        ];

        return (
          String(d.getDate()) +
          ' ' +
          fallbackMonths[d.getMonth()] +
          ' ' +
          String(d.getFullYear())
        );
    }

    return raw;
}

        return;

    btn.disabled = true;
    btn.textContent = 'Deleting…';

    google.script.run
        .withSuccessHandler(function () {
            try {
                projectDetailCacheV116.delete(pid);
                sessionStorage.removeItem('JAW_PROJECT_FAST_DETAIL_V167_' + pid);
            } catch (err) {}

            projectEditMode = false;
            projectEditBackupV122 = null;
            projectEditDraftV137 = null;
            currentProject = null;

            document.body.classList.remove('projectDetailOpenV108');
            document.body.classList.add('projectHomeOpenV122');

            toast('Manuscript deleted.');

            // Reload Home so counts, Recently Edited, list, and tasks are authoritative.
            google.script.run
                .withSuccessHandler(function (data) {
                    projectHomeData = data || projectHomeData;
                    try {
                        sessionStorage.setItem(
                            'JAW_PROJECT_HOME_V116',
                            JSON.stringify({ t: Date.now(), data: projectHomeData })
                        );
                    } catch (err) {}
                    renderProjectList();
                    renderProjectHome();
                })
                .withFailureHandler(function () {
                    renderProjectList();
                    renderProjectHome();
                })
                .getProjectsHomeBootstrapV117(ACCESS_KEY);
        })
        .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.setAttribute('data-step', '0');
            btn.textContent = 'Delete this manuscript';
            toast('Delete failed: ' + errText(err), true);
        })
        .deleteProjectForWebV190(pid, ACCESS_KEY);
}

function startProjectSurfaceV126_() {
    if (window.__JAW_PROJECT_SURFACE_STARTED_V126)
        return;
    window.__JAW_PROJECT_SURFACE_STARTED_V126 = true;
    initialize();
}
startProjectSurfaceV126_();

</script>

<script id="v167-project-article-style-fast-detail-cache">
(function(){
  var DETAIL_PREFIX_V167='JAW_PROJECT_FAST_DETAIL_V167_';
  var OPEN_SEQ_V167=0;
  var WARM_STARTED_V167=false;

  function detailKeyV167(pid){
    return DETAIL_PREFIX_V167+String(pid||'').toUpperCase();
  }

  function summaryV167(pid){
    try{
      return projectHomeData &&
        (projectHomeData.projects||[]).find(function(p){
          return String(p.Project_ID||'').toUpperCase()===pid;
        }) || null;
    }catch(e){
      return null;
    }
  }

  function readDetailV167(pid){
    try{
      var raw=localStorage.getItem(detailKeyV167(pid));
      if(!raw)return null;
      var x=JSON.parse(raw);
      if(!x||!x.data||!x.data.project)return null;

      var summary=summaryV167(pid);
      var cachedDate=String(
        x.data.project.Date_Modified ||
        x.dateModified ||
        ''
      );
      var currentDate=String(
        summary && summary.Date_Modified || ''
      );

      // The Home row acts as a cheap freshness token.
      if(
        currentDate &&
        cachedDate &&
        currentDate!==cachedDate
      ) return null;

      return x.data;
    }catch(e){
      return null;
    }
  }

  function saveDetailV167(pid,data){
    if(!pid||!data||!data.project)return;
    try{
      localStorage.setItem(
        detailKeyV167(pid),
        JSON.stringify({
          t:Date.now(),
          dateModified:String(data.project.Date_Modified||''),
          data:data
        })
      );
    }catch(e){}
  }

  function cloneV167(v){
    return JSON.parse(JSON.stringify(v));
  }

  function paintDeferredV167(pid,seq,data){
    if(
      seq!==OPEN_SEQ_V167 ||
      !currentProject ||
      String(currentProject.project.Project_ID||'').toUpperCase()!==pid
    ) return;

    currentProject.sources =
      Array.isArray(data&&data.sources) ? data.sources : [];
    currentProject.submissions =
      Array.isArray(data&&data.submissions) ? data.submissions : [];
    currentProject.tasks =
      Array.isArray(data&&data.tasks) ? data.tasks : [];
    currentProject.deferred=false;

    projectDetailCacheV116.set(
      pid,
      cloneV167(currentProject)
    );

    // Only patch deferred sections. Never full-render over active typing/editing.
    if(!projectEditMode){
      patchProjectDeferredSectionsV119_();
    }

    scheduleCurrentProjectTaskSyncV119(pid);
  }

  function loadDeferredV167(pid,seq){
    try{
      google.script.run
        .withSuccessHandler(function(data){
          paintDeferredV167(pid,seq,data||{});
        })
        .withFailureHandler(function(){})
        .getProjectDeferredForWebV119(
          pid,
          ACCESS_KEY
        );
    }catch(e){}
  }

  function renderCoreV167(pid,seq,core){
    if(seq!==OPEN_SEQ_V167)return;

    currentProject=core;
    currentProject.sources=null;
    currentProject.submissions=null;
    currentProject.tasks=null;
    currentProject.deferred=true;

    pendingProjectIdV115='';
    projectEditMode=false;
    projectLogStale.delete(pid);
    projectDetailCacheV116.set(
      pid,
      cloneV167(currentProject)
    );

    finishProjectRequestV115();
    renderProjectList();
    renderProjectDetail();

    safeHistoryV114(
      {view:'projects',project:pid},
      topUrl('projects',{project:pid}),
      'replace'
    );

    loadDeferredV167(pid,seq);
  }

  window.openProject=function(id){
    var pid=String(id||'').toUpperCase();
    if(!pid)return;

    var seq=++OPEN_SEQ_V167;

    document.body.classList.add('projectDetailOpenV108');
    pendingProjectIdV115=pid;
    projectEditMode=false;
    resourceEditorOpenV121=false;
    renderProjectList();

    // 1) In-memory full detail is the fastest possible path.
    var mem=projectDetailCacheV116.get(pid);
    if(
      mem &&
      mem.project &&
      mem.deferred!==true &&
      Array.isArray(mem.sources) &&
      Array.isArray(mem.tasks)
    ){
      pendingProjectIdV115='';
      currentProject=cloneV167(mem);
      renderProjectList();
      renderProjectDetail();
      safeHistoryV114(
        {view:'projects',project:pid},
        topUrl('projects',{project:pid}),
        'replace'
      );
      scheduleCurrentProjectTaskSyncV119(pid);
      return;
    }

    // 2) Browser materialized core can paint immediately.
    var local=readDetailV167(pid);
    if(local){
      currentProject=cloneV167(local);
      currentProject.sources=null;
      currentProject.submissions=null;
      currentProject.tasks=null;
      currentProject.deferred=true;
      pendingProjectIdV115='';
      projectDetailCacheV116.set(
        pid,
        cloneV167(currentProject)
      );
      renderProjectList();
      renderProjectDetail();
      safeHistoryV114(
        {view:'projects',project:pid},
        topUrl('projects',{project:pid}),
        'replace'
      );
      // Deferred data starts immediately after useful UI is visible.
      loadDeferredV167(pid,seq);
    }else{
      currentProject=null;
      showProjectTopLoaderV115();
      startProjectRequestWatchV115('Manuscript');
      var host=document.getElementById('projectContent');
      if(host)host.innerHTML='';
    }

    // 3) Server materialized snapshot refreshes/creates the browser snapshot.
    try{
      google.script.run
        .withSuccessHandler(function(fresh){
          if(
            seq!==OPEN_SEQ_V167 ||
            !fresh ||
            !fresh.project
          ) return;

          saveDetailV167(pid,fresh);

          // If local UI is already usable, never force a re-render/scroll.
          if(currentProject){
            var active=document.activeElement;
            var typing=active &&
              /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName||'');
            if(!typing && !projectEditMode){
              currentProject.project=fresh.project;
              currentProject.sections=
                Array.isArray(fresh.sections) ? fresh.sections : [];
              currentProject.resources=
                Array.isArray(fresh.resources) ? fresh.resources : [];
              projectDetailCacheV116.set(
                pid,
                cloneV167(currentProject)
              );
            }
            return;
          }

          renderCoreV167(
            pid,
            seq,
            fresh
          );
        })
        .withFailureHandler(function(err){
          if(seq!==OPEN_SEQ_V167)return;
          if(local)return; // cached UI is already usable.

          finishProjectRequestV115();
          pendingProjectIdV115='';
          renderProjectList();

          if(isProjectAuthErrorV119(err)){
            clearToken();
            showPairing(
              'Access denied. This private device link is not authorized for this browser.'
            );
            return;
          }

          var host=document.getElementById('projectContent');
          if(host){
            host.innerHTML=
              '<div class="emptyText">Failed to open Project.<br><br>'+
              '<button class="btn" type="button" onclick="openProject(\''+
              esc(pid)+
              '\')">Retry</button></div>';
          }
          toast(
            'Failed to get Manuscript data: '+errText(err),
            true
          );
        })
        .getProjectFastOpenCachedV167(
          pid,
          ACCESS_KEY
        );
    }catch(e){}
  };

  function warmServerV167(){
    if(WARM_STARTED_V167||!window.ACCESS_KEY)return;
    WARM_STARTED_V167=true;
    try{
      google.script.run
        .withSuccessHandler(function(){})
        .withFailureHandler(function(){})
        .warmProjectFastDetailCachesV167(
          ACCESS_KEY
        );
    }catch(e){}
  }

  function waitHomeV167(n){
    if(
      window.projectHomeData &&
      Array.isArray(projectHomeData.projects)
    ){
      // Useful Home first, warm Project snapshots afterward.
      setTimeout(warmServerV167,120);
      return;
    }
    if(n<80){
      setTimeout(function(){
        waitHomeV167(n+1);
      },100);
    }
  }

  window.addEventListener(
    'load',
    function(){
      waitHomeV167(0);
    }
  );
})();
</script>


<script id="v189-manuscript-newest-first">
(function(){
  function manuscriptIdRankV189_(id){
    var m=String(id||'').trim().match(/^M(\d{2})([a-z])$/i);
    if(!m)return 0;
    var group=Number(m[1]||0);
    var letter=String(m[2]||'a').toLowerCase().charCodeAt(0)-96;
    if(group<1||group>99||letter<1||letter>26)return 0;
    return ((group-1)*26)+letter;
  }

  function manuscriptNewestFirstV189_(rows){
    return (Array.isArray(rows)?rows.slice():[]).sort(function(a,b){
      // Project/Manuscript IDs are sequential creation IDs:
      // M01e is newer than M01d, then M01c, etc.
      var ar=manuscriptIdRankV189_(a&&a.Project_ID);
      var br=manuscriptIdRankV189_(b&&b.Project_ID);
      if(br!==ar)return br-ar;

      // Defensive fallback if an old/non-compact row ever exists.
      var bd=Date.parse(String(b&&b.Date_Added||b&&b.Date_Modified||''))||0;
      var ad=Date.parse(String(a&&a.Date_Added||a&&a.Date_Modified||''))||0;
      return bd-ad;
    });
  }

  window.manuscriptNewestFirstV189_=manuscriptNewestFirstV189_;

  // Final renderer override: sorting happens every time the shelf is painted.
  // This covers cached first-open data, fresh bootstrap data, search/filter,
  // background refresh, and manual refresh.
  window.renderProjectList=function(){
    if(!projectHomeData)return;

    var q=String(projectSearch||'').trim().toLowerCase();
    var rows=manuscriptNewestFirstV189_(projectHomeData.projects||[])
      .filter(function(p){
        return (projectFilter==='ALL'||p.Status===projectFilter) &&
          (!q||[p.Project_ID,p.Title].join(' ').toLowerCase().includes(q));
      });

    var count=document.getElementById('projectCount');
    if(count)count.textContent=rows.length+' manuscript'+(rows.length===1?'':'s');

    var list=document.getElementById('projectList');
    if(!list)return;

    list.innerHTML=rows.length
      ? rows.map(function(p){
          var active=
            (currentProject&&currentProject.project&&currentProject.project.Project_ID===p.Project_ID) ||
            pendingProjectIdV115===p.Project_ID;
          return '<button type="button" class="projectCard '+(active?'active':'')+
            '" onclick="openProject(\''+esc(p.Project_ID)+'\')">'+
            '<div class="projectCardTopV115">'+
              '<span class="projectId">'+esc(p.Project_ID)+'</span>'+
              '<span class="statusBadge status-'+esc(p.Status)+'">'+
                esc(projectStatusLabel(p.Status))+
              '</span>'+
            '</div>'+
            '<div class="projectTitle">'+esc(p.Title||'Untitled')+'</div>'+
          '</button>';
        }).join('')
      : '<div class="rowMeta">No manuscripts found.</div>';
  };

  // Keep in-memory order canonical too, so every subsequent local mutation
  // (including Add Manuscript) starts from the same newest-first sequence.
  function normalizeHomeV189_(){
    if(projectHomeData&&Array.isArray(projectHomeData.projects)){
      projectHomeData.projects=manuscriptNewestFirstV189_(projectHomeData.projects);
    }
  }

  var oldRenderProjectHomeV189_=window.renderProjectHome;
  if(typeof oldRenderProjectHomeV189_==='function'){
    window.renderProjectHome=function(){
      normalizeHomeV189_();
      return oldRenderProjectHomeV189_.apply(this,arguments);
    };
  }
})();
</script>
